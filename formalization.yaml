version: "v0.4"
project:
  name: "Milgrom–Segal Envelope Theorems for Arbitrary Choice Sets"
  description: >-
    Milgrom and Segal's Theorems 1 and 2 on [0,1], for an arbitrary nonempty
    choice type with explicitly finite real suprema. Absolute continuity of
    each fiber and an integrable common bound on its almost everywhere time
    derivative's absolute value imply absolute continuity of the supremum value function,
    without attainment. A frozen optimizer gives the interior derivative
    identity and both one-sided derivative inequalities, including their valid
    endpoints. If every fiber is differentiable at every interior time and
    maximizers exist almost everywhere, every almost everywhere optimizer
    selection has an integrable frozen-fiber derivative and satisfies the
    integral envelope formula, including both parameter endpoints. No topology,
    convexity, compactness or measurable structure on the choice type and no
    measurable selector assumption are required.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy Jose Guerra Barretto de Queiroz"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
  license: "BSD-3-Clause"
repository:
  role: "substantive-development"
classification:
  arxiv: ["econ.TH", "cs.GT", "math.CA"]
  msc2020: ["26A24", "26A46", "90C31", "91B02", "03B35"]
sources:
